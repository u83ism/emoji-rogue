<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>絵文字ローグ(ブラウザデモ)</title>
		<meta
			name="description"
			content="絵文字で描画するCLIローグライク「絵文字ローグ」のブラウザ版。地下26階のイェンダーの魔除けを手に入れて地上まで生還を目指す。"
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="絵文字ローグ" />
		<meta property="og:title" content="絵文字ローグ(ブラウザデモ)" />
		<meta
			property="og:description"
			content="絵文字で描画するCLIローグライク「絵文字ローグ」のブラウザ版。地下26階のイェンダーの魔除けを手に入れて地上まで生還を目指す。"
		/>
		<meta property="og:url" content="https://emoji-rogue-497.pages.dev/demo/" />
		<meta property="og:locale" content="ja_JP" />
		<meta name="twitter:card" content="summary" />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑</text></svg>"
		/>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<h1>絵文字ローグ</h1>
		<details id="manual" class="manual" open>
			<summary>操作方法</summary>
			<div class="manual-tables">
				<table>
					<caption>マップ</caption>
					<tbody>
						<tr>
							<th>移動・攻撃</th>
							<td><kbd>←↑↓→</kbd> / <kbd>h</kbd><kbd>j</kbd><kbd>k</kbd><kbd>l</kbd> / テンキー</td>
						</tr>
						<tr>
							<th>斜め移動</th>
							<td><kbd>y</kbd><kbd>u</kbd><kbd>b</kbd><kbd>n</kbd> / テンキーの<kbd>7</kbd><kbd>9</kbd><kbd>1</kbd><kbd>3</kbd></td>
						</tr>
						<tr>
							<th>待機</th>
							<td><kbd>.</kbd> / <kbd>Space</kbd></td>
						</tr>
						<tr>
							<th>探す</th>
							<td><kbd>s</kbd>(周り8マスの隠れた罠・隠し扉・隠し通路)</td>
						</tr>
						<tr>
							<th>階段を下りる</th>
							<td><kbd>&gt;</kbd>(<kbd>Shift</kbd>+<kbd>.</kbd>)</td>
						</tr>
						<tr>
							<th>階段を上る</th>
							<td><kbd>&lt;</kbd>(<kbd>Shift</kbd>+<kbd>,</kbd>)。魔除けが必要</td>
						</tr>
					</tbody>
				</table>
				<table>
					<caption>持ち物</caption>
					<tbody>
						<tr>
							<th>開く</th>
							<td><kbd>i</kbd></td>
						</tr>
						<tr>
							<th>選ぶ</th>
							<td><kbd>a</kbd>〜<kbd>z</kbd>(表示された文字)</td>
						</tr>
						<tr>
							<th>使う・装備する</th>
							<td><kbd>u</kbd>(杖はこのあと方向キー)</td>
						</tr>
						<tr>
							<th>投げる</th>
							<td><kbd>t</kbd>→方向キー(装備していない武器)</td>
						</tr>
						<tr>
							<th>捨てる</th>
							<td><kbd>d</kbd></td>
						</tr>
						<tr>
							<th>やめる・閉じる</th>
							<td><kbd>Esc</kbd></td>
						</tr>
					</tbody>
				</table>
			</div>
			<p class="manual-note">
				セーブは毎ターン自動です。半角入力モードで遊んでください。
			</p>
		</details>
		<div id="status" class="status"></div>
		<div id="map" class="map"></div>
		<div id="inventory" class="inventory" hidden></div>
		<div id="log" class="log"></div>
		<p id="warning" class="warning" hidden></p>
		<p id="seed" class="seed"></p>
		<script type="module" src="./main.js"></script>
	</body>
</html>
